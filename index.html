<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AIPR Atlas</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    #atlas-svg {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>

<body>
  <object
    id="atlas-svg"
    type="image/svg+xml"
    data="atlas.svg"
  >
    Your browser does not support SVGs.
  </object>

  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

  <script>
    var svgObject = document.getElementById('atlas-svg');
    var panZoomInstance = null;
    var resizeTimer = null;

    /*
     * Opening-view settings
     */
    var INITIAL_ZOOM = 1.35;

    /*
     * Positive X moves the Atlas to the right.
     * Positive Y moves the Atlas downward.
     */
    var INITIAL_PAN_X = 0.05;
    var INITIAL_PAN_Y = 0.08;

    function applyInitialView() {
      if (!panZoomInstance) return;

      /*
       * Begin from the standard fitted and centred view.
       */
      panZoomInstance.resize();
      panZoomInstance.fit();
      panZoomInstance.center();

      /*
       * Zoom 35% closer.
       */
      panZoomInstance.zoom(INITIAL_ZOOM);

      /*
       * Shift the enlarged Atlas toward the approximate
       * location of the Decision Narrative section.
       */
      requestAnimationFrame(function() {
        var sizes = panZoomInstance.getSizes();

        panZoomInstance.panBy({
          x: sizes.width * INITIAL_PAN_X,
          y: sizes.height * INITIAL_PAN_Y
        });
      });
    }

    function initPanZoom() {
      panZoomInstance = svgPanZoom(svgObject, {
        zoomEnabled: true,
        controlIconsEnabled: true,
        fit: true,
        center: true,
        minZoom: 0.5,
        maxZoom: 20
      });

      /*
       * Allow the embedded SVG to finish rendering
       * before applying the opening position.
       */
      setTimeout(applyInitialView, 100);
    }

    svgObject.addEventListener(
      'load',
      initPanZoom
    );

    window.addEventListener(
      'resize',
      function() {
        if (!panZoomInstance) return;

        clearTimeout(resizeTimer);

        resizeTimer = setTimeout(
          applyInitialView,
          100
        );
      }
    );
  </script>
</body>
</html>
